properties:
  data-ready-gpios:
    type: phandle-array

  sensitivity:
    type: string
    default: "1x"
    enum:
      - "1x"
      - "2x"
      - "3x"
      - "4x"

  invert-x:
    type: boolean
  invert-y:
    type: boolean

  clamp-x-min:
    type: int
    default: 128
  clamp-x-max:
    type: int
    default: 1920
  clamp-y-min:
    type: int
    default: 64
  clamp-y-max:
    type: int
    default: 1472

  x-div:
    type: int
    default: 4
    description: |
      x value will be divided by this value.
  y-div:
    type: int
    default: 3
    description: |
      y value will be divided by this value.
