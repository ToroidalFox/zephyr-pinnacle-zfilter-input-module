properties:
  sensitivity:
    type: string
    default: "1x"
    enum:
      - "1x"
      - "2x"
      - "3x"
      - "4x"
  clamp-x-min:
    type: int
    default: 128
  clamp-x-max:
    type: int
    default: 1920
  clamp-y-min:
    type: int
    default: 64
  clamp-y-max:
    type: int
    default: 1472
